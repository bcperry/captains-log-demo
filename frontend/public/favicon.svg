<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
  </defs>
  <!-- Ship's wheel (helm) icon representing Captain's Log -->
  <circle cx="50" cy="50" r="45" fill="url(#blueGradient)"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="white" stroke-width="4"/>
  <circle cx="50" cy="50" r="8" fill="white"/>
  <!-- Wheel spokes -->
  <line x1="50" y1="10" x2="50" y2="30" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="70" x2="50" y2="90" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="10" y1="50" x2="30" y2="50" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="50" x2="90" y2="50" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="21.72" y1="21.72" x2="35.86" y2="35.86" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="64.14" y1="64.14" x2="78.28" y2="78.28" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="78.28" y1="21.72" x2="64.14" y2="35.86" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="35.86" y1="64.14" x2="21.72" y2="78.28" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Wheel handles -->
  <circle cx="50" cy="10" r="5" fill="white"/>
  <circle cx="50" cy="90" r="5" fill="white"/>
  <circle cx="10" cy="50" r="5" fill="white"/>
  <circle cx="90" cy="50" r="5" fill="white"/>
  <circle cx="21.72" cy="21.72" r="5" fill="white"/>
  <circle cx="78.28" cy="78.28" r="5" fill="white"/>
  <circle cx="78.28" cy="21.72" r="5" fill="white"/>
  <circle cx="21.72" cy="78.28" r="5" fill="white"/>
</svg>
