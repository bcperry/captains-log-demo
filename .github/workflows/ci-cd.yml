name: CI/CD Pipeline

on:
  push:
    branches: [main, ralph/feature]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'commercial'
        type: choice
        options:
          - commercial
          - government

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run type checking (mypy)
        run: uv run mypy . --ignore-missing-imports

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: app/coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: captains-log-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Streamlit Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: false
          tags: captains-log-streamlit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-commercial:
    name: Deploy to Azure Commercial
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: commercial

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" `
            --federated-credential-provider "github" `
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"
        shell: pwsh

      - name: Set Azure environment
        run: |
          azd env new production --no-prompt || true
          azd env set AZURE_CLOUD commercial
          azd env set AZURE_LOCATION eastus
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision and deploy
        run: azd up --no-prompt
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run smoke tests
        run: |
          ENDPOINT=$(azd env get-values | grep -oP 'SERVICE_WEB_ENDPOINT=\K.*')
          curl -sf "${ENDPOINT}/health" || exit 1
          echo "Smoke test passed!"

  deploy-government:
    name: Deploy to Azure Government
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'government'
    environment: government

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure Government (Federated Credentials)
        run: |
          azd auth login `
            --client-id "${{ secrets.AZURE_GOV_CLIENT_ID }}" `
            --federated-credential-provider "github" `
            --tenant-id "${{ secrets.AZURE_GOV_TENANT_ID }}"
        shell: pwsh
        env:
          AZURE_CLOUD: AzureUSGovernment

      - name: Set Azure Government environment
        run: |
          azd env new production-gov --no-prompt || true
          azd env set AZURE_CLOUD government
          azd env set AZURE_LOCATION usgovvirginia
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}

      - name: Provision and deploy to Government
        run: azd up --no-prompt
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_GOV_SUBSCRIPTION_ID }}
          AZURE_CLOUD: AzureUSGovernment

      - name: Run smoke tests
        run: |
          ENDPOINT=$(azd env get-values | grep -oP 'SERVICE_WEB_ENDPOINT=\K.*')
          curl -sf "${ENDPOINT}/health" || exit 1
          echo "Government smoke test passed!"
